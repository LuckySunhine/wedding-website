
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicholas & Yen Ling | Our Wedding</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f8f4ed;
  color: #51463e;
  font-family: Georgia, "Times New Roman", serif;
  text-align: center;
}

main {
  max-width: 720px;
  margin: auto;
  padding: 40px 22px 70px;
}

.small-title {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 4px;
  color: #907e6c;
}

h1 {
  font-size: clamp(38px, 9vw, 64px);
  font-weight: normal;
  font-style: italic;
  line-height: 1.15;
  margin: 25px 0;
}

.cover {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 180px 180px 5px 5px;
  margin: 30px auto;
}

h2 {
  font-size: 30px;
  font-weight: normal;
  font-style: italic;
}

.line {
  width: 55px;
  border-top: 1px solid #b7a28d;
  margin: 30px auto;
}

.details {
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  line-height: 2.2;
  color: #806f60;
}
  
/* Romantic Ivory full-screen entrance */
#enterMusicButton {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  margin: 0 !important;
  padding: 40px 25px !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: #f8f4ed !important;
  color: #51463e !important;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 22px;
  font-family: Georgia, serif !important;
  font-size: 25px !important;
  text-align: center;
  line-height: 1.6;
  white-space: normal;
}

#enterMusicButton::before {
  content: "THE WEDDING CELEBRATION OF";
  display: block;
  font: 11px Arial, sans-serif;
  letter-spacing: 3px;
  color: #927b66;
}

#enterMusicButton::after {
  content: "14 MARCH 2027  ·  CHIJMES HALL";
  display: block;
  font: 11px Arial, sans-serif;
  letter-spacing: 2px;
  color: #927b66;
}

</style>
</head>

<body>
<main>

<p class="small-title">THE WEDDING OF</p>

<h1>Nicholas<br>&amp; Yen Ling</h1>

<img
  class="cover"
  src="cover.jpg.PNG"
  alt="Nicholas and Yen Ling at golden mountain sunset"
>

<p class="small-title">LUCKY &amp; SUNSHINE</p>

<div class="line"></div>

<h2>Forever and Always</h2>

<p class="details">
SUNDAY, 14 MARCH 2027<br>
CHIJMES HALL · SINGAPORE
</p>

</main>

<audio id="weddingMusic" loop preload="none">
  <source src="wedding-music.mp3.mp3" type="audio/mpeg">
</audio>

<button id="enterMusicButton" type="button"
  style="background:#7e6c5b;color:white;
  border:0;border-radius:30px;
  padding:16px 26px;font-size:16px;
  font-family:Georgia,serif;
  margin:25px auto;cursor:pointer;">
  ♡ Enter Our Love Story
</button>

<script>
const music = document.getElementById("weddingMusic");
const button = document.getElementById("enterMusicButton");

button.addEventListener("click", async () => {
  if (music.paused) {
    try {
      await music.play();
      button.textContent = "♫ Pause Music";
    } catch (error) {
      button.textContent = "Tap to Try Music Again";
    }
  } else {
    music.pause();
    button.textContent = "♫ Play Music";
  }
});
</script>

</body>
</html>
